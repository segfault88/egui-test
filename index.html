<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>egui + wgpu</title>

    <!-- Generated by wasm-bindgen (see build-web.sh). `init()` loads the wasm and runs `main`. -->
    <script type="module">
        import init from "./egui_test.js";
        init();
    </script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1b1b1b;
            color: #ddd;
            font-family: sans-serif;
        }

        /* eframe sizes the canvas' backing buffer to match its CSS size. */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loading_text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <div id="loading_text"><p>Loading…</p></div>
</body>
