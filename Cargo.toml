[package]
name = "egui-test"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
# eframe is egui's official framework. Its default renderer is wgpu (via
# egui-wgpu); natively it opens the window with winit, and on the web it drives
# a <canvas>. It re-exports `egui`, `egui_wgpu` and `wgpu`.
eframe = "0.37.0"
glam = { version = "0.34.3", features = ["bytemuck"] }
log = "0.4.35"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize dependencies even in debug builds, so the UI stays smooth.
[profile.dev.package."*"]
opt-level = 2
